<section class="hero" aria-labelledby="hero-title">
  <div class="hero-shade"></div>
  <div class="hero-content reveal">
    <p class="eyebrow light">Varkala · Kerala</p>
    <h1 id="hero-title">A slower rhythm<br>by the sea.</h1>
    <p class="hero-copy">A private coastal house where warm hospitality, quiet design, and endless horizons meet.</p>
    <a href="#stays" class="link-arrow light">Discover the house <svg><use href="#icon-arrow"></use></svg></a>
  </div>
  <div class="hero-meta">
    <span>8.7379° N</span>
    <span>76.7163° E</span>
  </div>
</section>

<section class="booking-bar-wrap" id="reserve" aria-label="Check availability">
  <form class="booking-bar" id="availability-form">
    <label class="booking-field">
      <span>Check in</span>
      <span class="input-shell"><svg><use href="#icon-calendar"></use></svg><input type="date" id="check-in" name="check_in" min="{{ today }}" required></span>
    </label>
    <label class="booking-field">
      <span>Check out</span>
      <span class="input-shell"><svg><use href="#icon-calendar"></use></svg><input type="date" id="check-out" name="check_out" min="{{ today }}" required></span>
    </label>
    <label class="booking-field">
      <span>Guests</span>
      <span class="input-shell"><svg><use href="#icon-users"></use></svg><select id="guests" name="guests" aria-label="Guests"><option value="1">1 guest</option><option value="2" selected>2 guests</option><option value="3">3 guests</option><option value="4">4 guests</option></select></span>
    </label>
    <button class="button button-coral availability-button" type="submit">
      <span>Check availability</span><svg><use href="#icon-arrow"></use></svg>
    </button>
  </form>
</section>
