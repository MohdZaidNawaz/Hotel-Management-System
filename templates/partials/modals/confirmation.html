<dialog class="modal modal-small" id="confirmation-modal" aria-labelledby="confirmation-title">
  <button class="modal-close" type="button" data-close-modal aria-label="Close"><svg><use href="#icon-close"></use></svg></button>
  <div class="confirmation-content">
    <span class="success-icon"><svg><use href="#icon-check"></use></svg></span>
    <p class="eyebrow">Reservation confirmed</p>
    <h2 id="confirmation-title">The coast is calling.</h2>
    <p>We look forward to welcoming you, <strong id="confirmed-guest"></strong>. Keep this confirmation code handy:</p>
    <button class="confirmation-code" id="confirmation-code" type="button" title="Copy confirmation code">SOL-000000</button>
    <div class="confirmed-details" id="confirmed-details"></div>
    <button class="button button-dark button-wide" type="button" data-close-modal>Done</button>
  </div>
</dialog>
